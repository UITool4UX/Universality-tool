# Pins the BaseWeb widget theme so number_input / slider / select chrome
# stops auto-following the visitor's OS dark-mode preference. Without this
# file, Streamlit's own widget skin (not your CSS) decides those colors.
#
# Tokens mirror the design-system module (ui/design_system.py, 2026-08-28,
# the index-v6 reference) — Part A of its stylesheet requires base="light"
# to override the native widget skin.
#
# This file only sets Streamlit's native theme variables. It does not
# touch universality/ and cannot change calculation behavior.

[theme]
base = "light"
primaryColor = "#2454E8"           # --signal, used for focus rings / active states
backgroundColor = "#F5F7FB"        # --paper
secondaryBackgroundColor = "#FFFFFF"  # --surface, widget fill color
textColor = "#0E1A30"              # --ink
font = "sans"                      # --ui (DM Sans / system sans; display figures styled via CSS)

[server]
# unrelated to theming — left as-is if you already set this elsewhere
